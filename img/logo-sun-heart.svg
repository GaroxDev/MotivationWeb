<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="100%" stop-color="#b3e6ff"/>
    </linearGradient>
    <linearGradient id="sunGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="heartGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad2)"/>
  
  <!-- Rising Sun Rays behind top of heart -->
  <g stroke="url(#sunGrad2)" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="65" x2="256" y2="40"/>
    <line x1="180" y1="80" x2="165" y2="55"/>
    <line x1="332" y1="80" x2="347" y2="55"/>
    <line x1="120" y1="125" x2="98" y2="110"/>
    <line x1="392" y1="125" x2="414" y2="110"/>
  </g>
  
  <!-- Rising Sun Half Circle -->
  <path d="M 160 145 A 96 96 0 0 1 352 145 Z" fill="url(#sunGrad2)"/>
  
  <!-- Main Heart Outline -->
  <path d="M 256 430 C 130 340 75 265 75 185 C 75 120 125 80 190 80 C 225 80 245 95 256 108 C 267 95 287 80 322 80 C 387 80 437 120 437 185 C 437 265 382 340 256 430 Z" 
        fill="none" stroke="url(#heartGrad2)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Glowing Center Sparkle -->
  <path d="M 256 200 Q 256 240 296 240 Q 256 240 256 280 Q 256 240 216 240 Q 256 240 256 200 Z" fill="url(#sunGrad2)"/>
</svg>
